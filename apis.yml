name: Novotech
description: 'Novotech is a global full-service Contract Research Organization (CRO) that partners
  with biotech and pharmaceutical companies across every phase of clinical drug development. Its
  services span clinical operations and project management, patient recruitment and site selection,
  early-phase trials (notably in Australia), regulatory and medical consulting, biometrics and data
  management, site management organization (SMO), and laboratory services. Novotech reports 4,450+
  trials conducted across 7,260+ trial sites in 50+ countries, supporting 60+ drugs to market. Added
  to the API Evangelist network as a healthcare portfolio company of Hongshan; it publishes no public
  API, developer portal, or technical integration surface as of this enrichment pass.'
